
<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My English Teacher</title>
    <link rel="icon" href="/logo.png">
    <link rel="apple-touch-icon" href="/logo.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Lilita+One&family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --sky-blue: #3b82f6;
            --candy-pink: #ec4899;
            --leaf-green: #22c55e;
            --grape-purple: #8b5cf6;
            --sun-yellow: #fbbf24;
            --heart-red: #ef4444;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background: linear-gradient(180deg, #1e3a8a 0%, #1e1b6b 45%, #140f3d 100%);
            background-attachment: fixed;
            overflow-x: hidden;
            color: #f8fafc;
        }

        .gaming-font {
            font-family: 'Fredoka', sans-serif;
            font-weight: 700;
        }

        /* English-only / numeric-only text (Lilita One has no Hebrew glyphs) */
        .en-font {
            font-family: 'Lilita One', cursive;
            font-weight: 400;
            letter-spacing: 0.02em;
        }

        /* Gummy 3D Button - inspired by the app design mockups */
        .roblox-btn {
            position: relative;
            transition: all 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border-bottom-width: 6px;
            border-radius: 24px;
            font-family: 'Fredoka', sans-serif;
            font-weight: 600;
        }
        .roblox-btn:hover {
            transform: translateY(-2px);
            filter: brightness(1.07);
        }
        .roblox-btn:active {
            transform: translateY(4px);
            border-bottom-width: 2px;
        }

        /* Soft card panel */
        .glass-panel {
            background: rgba(30, 27, 107, 0.55);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 8px 28px 0 rgba(0, 0, 0, 0.35);
        }

        /* White word-card, like the mockup's flashcard/quiz card */
        .word-card {
            background: #ffffff;
            color: #1e293b;
            border-radius: 28px;
            box-shadow: 0 10px 0 0 #c7d2fe, 0 14px 24px rgba(0,0,0,0.3);
        }

        /* Shimmer Effect */
        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }
        .shimmer-card {
            background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.1) 50%, rgba(255,255,255,0) 100%);
            background-size: 200% 100%;
            animation: shimmer 3s infinite;
        }

        /* Floating Animation */
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }
        .animate-float {
            animation: float 4s infinite ease-in-out;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 10px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); }
        ::-webkit-scrollbar-thumb {
            background: linear-gradient(var(--grape-purple), var(--sky-blue));
            border-radius: 20px;
        }

        .glow-cyan { box-shadow: 0 0 20px rgba(59, 130, 246, 0.4); }
        .glow-purple { box-shadow: 0 0 20px rgba(139, 92, 246, 0.4); }
        .glow-green { box-shadow: 0 0 20px rgba(34, 197, 94, 0.4); }

        /* Game Results HUD Style */
        .result-badge {
            background: linear-gradient(135deg, rgba(255,255,255,0.14), rgba(255,255,255,0.06));
            border: 2px solid rgba(255,255,255,0.14);
            border-radius: 24px;
        }

        /* Confetti bits for the victory screen */
        @keyframes confetti-fall {
            0% { transform: translateY(-20px) rotate(0deg); opacity: 1; }
            100% { transform: translateY(140px) rotate(360deg); opacity: 0; }
        }
        .confetti-piece {
            position: absolute;
            animation: confetti-fall 2.2s ease-in infinite;
        }

        /* Sound Catcher - מילים נופלות. duration/delay נקבעים per-item ב-inline style */
        @keyframes word-fall {
            0% { top: -3rem; }
            100% { top: 100%; }
        }
        .word-falling {
            position: absolute;
            animation-name: word-fall;
            animation-timing-function: linear;
            animation-fill-mode: forwards;
        }
    </style>
<script type="importmap">

</head>

</html>
